name: Build iOS IPA (personal sideloading)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project TourFundManager.xcodeproj \
            -scheme TourFundManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA for sideloading
        run: |
          APP_PATH="ios/build/DerivedData/Build/Products/Release-iphoneos/TourFundManager.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry TourFundManager-unsigned.ipa Payload
          mkdir -p artifacts
          mv TourFundManager-unsigned.ipa artifacts/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tour-fund-manager-ios-unsigned-ipa
          path: artifacts/TourFundManager-unsigned.ipa
          retention-days: 14
